name = "usmarket-dispatch"
main = "src/index.js"
compatibility_date = "2026-10-01"

# UTC. The free plan allows 5 Cron Triggers per account, so the slots are grouped into 4 expressions;
# src/index.js maps each fired time to a repo (SLOTS). Cloudflare numbers weekdays 1 = Sunday: use names.
#   JPN 15:50 / 16:10 / 16:30 / 17:00 JST,  USA 07:00 / 07:30 / 08:00 / 08:30 JST
[triggers]
crons = ["50 6 * * mon-fri", "10,30 7 * * mon-fri", "0 8 * * mon-fri", "0,30 22-23 * * mon-fri"]

# GITHUB_TOKEN is a secret: npx wrangler secret put GITHUB_TOKEN

[observability]
enabled = true
